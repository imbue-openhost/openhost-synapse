[app]
name = "openhost-community-chat"
version = "0.1.0"
description = "Cloud in a Bottle Community Chat: Matrix Synapse homeserver with a bundled web client, owner SSO, and one-click community-space join"

[runtime.container]
image = "Dockerfile"
port = 3000

[routing]
public_paths = [
    "/_matrix/",
    "/_synapse/client/",
    "/.well-known/matrix/",
]

[[links]]
name = "admin"
path = "/_openhost/admin"

[resources]
memory_mb = 2048
cpu_millicores = 2000

[data]
app_data = true
